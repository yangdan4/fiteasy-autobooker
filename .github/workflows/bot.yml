name: fiteasy-bot

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (GitHub minimum); each run polls ~10s internally
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fiteasy-bot
  cancel-in-progress: false   # queued runs wait, giving near-continuous coverage

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-bot.txt
      - name: Run booking bot
        env:
          FITEASY_EMAIL: ${{ secrets.FITEASY_EMAIL }}
          FITEASY_PASSWORD: ${{ secrets.FITEASY_PASSWORD }}
          FITEASY_SHOP_SLUG: sauna60-room
          FITEASY_SHOP_ID: "230"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_SECONDS: "270"
          TZ: Asia/Tokyo
        run: python -m bot.runner
